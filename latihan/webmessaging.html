<!DOCTYPE HTML>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Drag and Drop</title>
  <style>
    #dest {
      background: lightblue;
      border: 1px solid #444;
      width: 320px;
      height: 100px;
      padding: 10px;
    }

    img {
      margin-right: 10px;
      cursor: grab;
    }
  </style>
</head>
<body>

  <div id="dest" ondrop="drop(event)" ondragover="allow(event)"></div>
  <br>
  <p>Drag the image below into the above element:</p>
  <br>

  <img id="source1" src="bola.jpg" alt="Gambar 1" draggable="true" ondragstart="drag(event)">
  <img id="source2" src="bskt.jpg" alt="Gambar 2" draggable="true" ondragstart="drag(event)">
  <img id="source3" src="jeruk.jpg" alt="Gambar 3" draggable="true" ondragstart="drag(event)">

  <script>
    function allow(event) {
      event.preventDefault();
    }

    function drag(event) {
      // Menggunakan mime-type 'text/plain' agar kompatibel secara standar
      event.dataTransfer.setData('text/plain', event.target.id);
    }

    function drop(event) {
      event.preventDefault();
      var data = event.dataTransfer.getData('text/plain');
      // Menggunakan document.getElementById() bawaan JS sebagai pengganti fungsi O()
      var element = document.getElementById(data);
      if (element) {
        event.target.appendChild(element);
      }
    }

     function drop(event) {

      var element = document.getElementById(data);
      if (element) {
        event.target.appendChild(element);
      }
    }
  </script>

</body>
</html>
